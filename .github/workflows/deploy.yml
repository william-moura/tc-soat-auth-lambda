name: Deploy AWS Lambda

on:
  pull_request:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar Dependências
        run: |
          if [ -f package.json ]; then
            npm install --production
          fi

      - name: Criar Pacote ZIP
        run: |
          zip -r function.zip . -x "*.git*" "*github*"

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Atualizar Código da Lambda na AWS
        run: |
          aws lambda update-function-code \
            --function-name tc-soat-auth-lambda \
            --zip-file fileb://function.zip

      - name: Ajustar Configuração do Handler
        run: |
          aws lambda update-function-configuration \
            --function-name tc-soat-auth-lambda \
            --handler index.handler
      - name: Atualizar Código da Lambda na AWS - Versão 2
        run: |
          aws lambda update-function-code \
            --function-name tc-soat-auth-lambda \
            --zip-file fileb://function.zip

      - name: Aguardar Conclusão da Atualização
        run: |
          aws lambda wait function-updated \
            --function-name tc-soat-auth-lambda

      - name: Ajustar Configuração do Handler
        run: |
          aws lambda update-function-configuration \
            --function-name tc-soat-auth-lambda \
            --handler index.handler